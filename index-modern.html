<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立科技高中─校園社團介紹網</title>
    <style>
        :root {
            --font: "標楷體", "DFKai-SB", "BiauKai", serif;
            --page-w: 1024px;
            --page-h: 768px;
            --gutter: 12px;
            --header-h: 65px;
            --footer-h: 20px;
            --left-w: 215px;
            --marquee-h: 29px;
            --update-h: 25px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            font-size: 16px;
            color: #000;
        }

        /* 整頁以 grid 排版，取代 float / clear */
        .page {
            display: grid;
            grid-template-columns: var(--left-w) 1fr;
            grid-template-rows: var(--header-h) 1fr var(--footer-h);
            grid-template-areas:
                "header header"
                "side   main"
                "footer footer";
            column-gap: var(--gutter);
            width: var(--page-w);
            height: var(--page-h);
            margin-inline: auto;
            padding-inline: var(--gutter);
        }

        .site-header {
            grid-area: header;
        }

        .site-header img {
            display: block;
        }

        .side {
            grid-area: side;
            display: flex;
            flex-direction: column;
        }

        .nav {
            flex: 1;
        }

        .nav h2 {
            font-size: 24px;
            font-weight: 500;
            text-align: center;
            text-decoration: underline;
            color: #f0f;
        }

        .nav ul {
            list-style: none;
        }

        .nav a,
        .nav span {
            display: block;
            height: 40px;
            line-height: 40px;
            text-align: center;
            color: inherit;
            background: url("./images/menu1.png") no-repeat center;
        }

        .nav li:hover>a,
        .nav li:hover>span {
            background-image: url("./images/menu2.png");
        }

        .updated {
            height: var(--update-h);
            line-height: var(--update-h);
            text-align: center;
        }

        .main {
            grid-area: main;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* 取代已被棄用的 <marquee> */
        .ticker {
            height: var(--marquee-h);
            overflow: hidden;
            font-size: 24px;
            line-height: var(--marquee-h);
            color: #00f;
            white-space: nowrap;
        }

        .ticker p {
            display: inline-block;
            padding-left: 100%;
            animation: scroll 30s linear infinite;
        }

        @keyframes scroll {
            to {
                transform: translateX(-100%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .ticker p {
                animation: none;
                padding-left: 0;
            }
        }

        .main iframe {
            flex: 1;
            width: 100%;
            border: 0;
        }

        .site-footer {
            grid-area: footer;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="site-header">
            <h1>
                <a href="./index-modern.html">
                    <img src="./images/logo.png" alt="國立科技高中校園社團介紹網" title="國立科技高中校園社團介紹網">
                </a>
            </h1>
        </header>

        <aside class="side">
            <nav class="nav" aria-labelledby="nav-title">
                <h2 id="nav-title">社團介紹</h2>
                <ul>
                    <li><a href="./guitar_history.html" target="content">吉他社</a></li>
                    <li><span>熱舞社</span></li>
                    <li><span>棒球社</span></li>
                    <li><span>羽球社</span></li>
                    <li><span>足球社</span></li>
                    <li><span>童軍社</span></li>
                </ul>
            </nav>
            <p class="updated">最近更新日期：<time datetime="2006-10-22">2006/10/22</time></p>
        </aside>

        <main class="main">
            <div class="ticker" role="marquee">
                <p>歡迎光臨校園社團介紹網，參觀後請支持社團活動並熱烈參與</p>
            </div>
            <iframe name="content" src="./main.html" title="社團內容"></iframe>
        </main>

        <footer class="site-footer">網頁設計及維護：18張聖威</footer>
    </div>
</body>

</html>
